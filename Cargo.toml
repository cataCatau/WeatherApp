[package]
name = "WeatherApp"
version = "0.1.0"
edition = "2024"

[dependencies]
egui = "0.27"
eframe = { version = "0.27", features = ["wgpu"] }

reqwest = { version = "0.12", features = ["json"] }

tokio = { version = "1.36", features = ["full"] }

serde = { version = "1.0", features = ["derive"] }